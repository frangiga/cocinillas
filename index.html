<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Cocinillas</title>
  <style>
    :root {
      --bg-color: #030d22;
      --card-bg: #0033aa;
      --accent-blue: #0066ff;
      --accent-orange: #ff5500;
      --accent-orange-bright: #ff3300;
      --text-main: #ffffff;
      --text-muted: #a0c4ff;
      --black-accent: #020712;
      --border-color: #0055ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow: hidden; /* Cero scroll */
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    header {
      text-align: center;
      padding-top: 6px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(0, 102, 255, 0.6);
    }

    /* Selector compacto no ajustado al ancho */
    .selector-box {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-orange);
      border-radius: 12px;
      padding: 8px 12px;
      margin: 8px auto;
      width: 75%; /* Ancho reducido */
      box-shadow: 0 4px 12px rgba(255, 85, 0, 0.2);
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 4px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    select {
      width: 100%;
      background-color: var(--black-accent);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      outline: none;
      text-align: center;
      text-align-last: center; /* Forzar centrado en móviles */
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23ff5500" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
    }

    /* Grilla de miembros familiares */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin: 6px 0;
    }

    .member-card {
      background: linear-gradient(145deg, #002277, #0044cc);
      border: 1.5px solid var(--accent-blue);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    .member-name {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .member-value {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
    }

    .unit {
      font-size: 0.75rem;
      color: var(--accent-orange);
      font-weight: 700;
      margin-left: 2px;
    }

    /* Caja de Total compacta */
    .total-card {
      background: linear-gradient(135deg, var(--black-accent) 0%, #001133 100%);
      border: 2px solid var(--accent-orange);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      width: 80%; /* Ancho reducido */
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
      margin: 6px auto;
    }

    .total-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-orange);
      font-weight: 900;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .total-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      white-space: nowrap;
    }

    /* Footer con firma estricta */
    footer {
      width: 100%;
      text-align: center;
      padding-top: 8px;
      padding-bottom: 4px;
      border-top: 1px solid rgba(0, 102, 255, 0.3);
    }

    .signature {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .signature a {
      color: var(--accent-orange);
      font-weight: 800;
      text-decoration: none;
    }

    .signature a:hover, .signature a:active {
      color: var(--accent-orange-bright);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Encabezado -->
    <header>
      <h1>EL COCINILLAS</h1>
    </header>

    <!-- Selector (No ajustado al ancho / Texto centrado) -->
    <div class="selector-box">
      <label for="product-select">Producto</label>
      <select id="product-select" onchange="calculateAmounts()">
        <option value="arroz">Arroz</option>
        <option value="pasta">Pasta</option>
        <option value="fideua">Fideuá</option>
      </select>
    </div>

    <!-- Casilleros Nombres en Mayúsculas -->
    <div class="family-grid">
      <div class="member-card">
        <div class="member-name">FRAN</div>
        <div class="member-value"><span id="fran-qty">0</span><span class="unit">g</span></div>
      </div>
      <div class="member-card">
        <div class="member-name">LAURA</div>
        <div class="member-value"><span id="laura-qty">0</span><span class="unit">g</span></div>
      </div>
      <div class="member-card">
        <div class="member-name">ENZO</div>
        <div class="member-value"><span id="enzo-qty">0</span><span class="unit">g</span></div>
      </div>
    </div>

    <!-- Total a Cocer (No ajustado al ancho) -->
    <div class="total-card">
      <div class="total-label">Total a Cocer</div>
      <div class="total-value"><span id="total-qty">0</span> <span style="font-size: 1.2rem; color: var(--accent-orange);">g</span></div>
    </div>

    <!-- Firma con Link a Instagram -->
    <footer>
      <div class="signature">
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </div>
    </footer>
  </div>

  <script>
    // Datos exactos extraídos de la tabla
    const dietData = {
      arroz:  { fran: 70, laura: 40, enzo: 40 },
      pasta:  { fran: 60, laura: 50, enzo: 50 },
      fideua: { fran: 60, laura: 40, enzo: 40 }
    };

    function calculateAmounts() {
      const selectedProduct = document.getElementById('product-select').value;
      const data = dietData[selectedProduct];

      if (data) {
        document.getElementById('fran-qty').textContent = data.fran;
        document.getElementById('laura-qty').textContent = data.laura;
        document.getElementById('enzo-qty').textContent = data.enzo;

        const total = data.fran + data.laura + data.enzo;
        document.getElementById('total-qty').textContent = total;
      }
    }

    // Inicializar al cargar
    document.addEventListener('DOMContentLoaded', calculateAmounts);
  </script>

</body>
</html>
