<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asistente de Cocina - Cantidades Dieta</title>
  <style>
    :root {
      --bg-color: #0b131e;
      --card-bg: #1c2a3e;
      --accent-orange: #f95738;
      --accent-orange-hover: #e0482b;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --border-color: #2d3748;
      --black-accent: #05080c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow: hidden; /* Garantiza cero scroll en pantalla */
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      text-align: center;
      padding-top: 4px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--accent-orange);
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* Selector desplegable */
    .selector-box {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-orange);
      border-radius: 12px;
      padding: 8px 12px;
      margin: 10px 0;
    }

    label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 700;
      white-space: nowrap;
    }

    select {
      width: 100%;
      background-color: var(--black-accent);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23f95738" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    /* Grilla de familiares */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .member-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .member-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .member-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .unit {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 1px;
    }

    /* Caja de Total */
    .total-card {
      background: linear-gradient(135deg, var(--black-accent) 0%, #111a24 100%);
      border: 2px solid var(--accent-orange);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(249, 87, 56, 0.15);
    }

    .total-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-orange);
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .total-value {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      white-space: nowrap;
    }

    /* Footer con firma estricta en 1 línea */
    footer {
      text-align: center;
      padding-top: 8px;
      padding-bottom: 4px;
      border-top: 1px solid var(--border-color);
    }

    .signature {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .signature span {
      color: var(--accent-orange);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Encabezado -->
    <header>
      <h1>Asistente de Cocina</h1>
      <div class="subtitle">Cálculo Rápido de Raciones</div>
    </header>

    <!-- Selector -->
    <div class="selector-box">
      <label for="product-select">Selecciona Producto Base</label>
      <select id="product-select" onchange="calculateAmounts()">
        <option value="arroz">Arroz</option>
        <option value="pasta">Pasta</option>
        <option value="fideua">Fideuá</option>
      </select>
    </div>

    <!-- Casilleros Miembros -->
    <div class="family-grid">
      <div class="member-card">
        <div class="member-name">Fran</div>
        <div class="member-value"><span id="fran-qty">0</span><span class="unit">g</span></div>
      </div>
      <div class="member-card">
        <div class="member-name">Laura</div>
        <div class="member-value"><span id="laura-qty">0</span><span class="unit">g</span></div>
      </div>
      <div class="member-card">
        <div class="member-name">Enzo</div>
        <div class="member-value"><span id="enzo-qty">0</span><span class="unit">g</span></div>
      </div>
    </div>

    <!-- Total a Cocer -->
    <div class="total-card">
      <div class="total-label">Total a Cocer</div>
      <div class="total-value"><span id="total-qty">0</span> <span style="font-size: 1.2rem; color: var(--accent-orange);">g</span></div>
    </div>

    <!-- Firma -->
    <footer>
      <div class="signature">
        Desarrollado por <span>fran_giga</span> | La Orden Del Misterio
      </div>
    </footer>
  </div>

  <script>
    // Datos exactos extraídos de la tabla
    const dietData = {
      arroz:  { fran: 70, laura: 40, enzo: 40 },
      pasta:  { fran: 60, laura: 50, enzo: 50 },
      fideua: { fran: 60, laura: 40, enzo: 40 }
    };

    function calculateAmounts() {
      const selectedProduct = document.getElementById('product-select').value;
      const data = dietData[selectedProduct];

      if (data) {
        document.getElementById('fran-qty').textContent = data.fran;
        document.getElementById('laura-qty').textContent = data.laura;
        document.getElementById('enzo-qty').textContent = data.enzo;

        const total = data.fran + data.laura + data.enzo;
        document.getElementById('total-qty').textContent = total;
      }
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', calculateAmounts);
  </script>

</body>
</html>
